version: "3.9"

# =============================================================
# LOCAL INFRASTRUCTURE ONLY
# Run: docker compose up -d
# This starts MySQL, Redis, Kafka, Zookeeper, Zipkin, Kong.
# Spring Boot services are run separately via Maven/IntelliJ.
# =============================================================

services:

  # ── MySQL (single instance, all databases auto-created) ──
  mysql:
    image: mysql:8.0
    container_name: ec-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: ecuser
      MYSQL_PASSWORD: ecpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql-init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ── Zookeeper (required by Kafka) ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ec-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ── Kafka (accessible from localhost:9092) ──
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ec-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "incident.created:3:1,incident.updated:3:1,resource.assigned:3:1,resource.released:3:1,auth.event:1:1"

  # ── Kafdrop (Kafka UI) ──
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: ec-kafdrop
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
    depends_on:
      - kafka

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: ec-redis
    restart: unless-stopped
    command: redis-server --requirepass ecpassword
    ports:
      - "6379:6379"

  # ── Zipkin (distributed tracing) ──
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: ec-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"

  # ── Kong API Gateway ──
  # Routes all frontend requests through a single port (8000)
  # to the correct Spring Boot service running on your laptop.
  # Uses host.docker.internal to reach services on your machine.
  kong:
    image: kong:3.6
    container_name: ec-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    ports:
      - "8000:8000"   # Frontend talks to this port
      - "8001:8001"   # Kong Admin API
    volumes:
      - ./kong/kong.yml:/kong/kong.yml
    depends_on:
      - redis

  # ── Prometheus (metrics collection) ──
  # Scrapes /actuator/prometheus from each Spring Boot service running
  # on the host machine via host.docker.internal.
  prometheus:
    image: prom/prometheus:latest
    container_name: ec-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  # ── Grafana (dashboards for the metrics collected by Prometheus) ──
  grafana:
    image: grafana/grafana:latest
    container_name: ec-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  mysql-data:
  prometheus-data:
  grafana-data: