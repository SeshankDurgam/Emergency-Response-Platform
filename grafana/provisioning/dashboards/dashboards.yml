#
# Tells Grafana to load any dashboard JSON files placed in
# /var/lib/grafana/dashboards (mounted from ./grafana/dashboards).

apiVersion: 1

providers:
  - name: EmergencyConnectUAE
    orgId: 1
    folder: EmergencyConnectUAE
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
