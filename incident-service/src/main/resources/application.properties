# ============================================================
# INCIDENT SERVICE - Works locally AND in Kubernetes
# Local defaults used when env vars are not set
# ============================================================

# Server
server.port=8082
server.shutdown=graceful
server.ssl.enabled=true
server.ssl.key-store=file:${SSL_KEYSTORE_PATH:/etc/ssl/certs/keystore.p12}
server.ssl.key-store-password=ecpassword
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=emergencyconnect
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

# Application Name
spring.application.name=incident-service

# DataSource - Primary (shard 0)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/incident_shard_0?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.hikari.pool-name=IncidentHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:ecpassword}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.consumer.group-id=incident-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=50
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:https://eureka-server:8761/eureka}
eureka.client.registry-fetch-interval-seconds=30
eureka.instance.prefer-ip-address=true
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
eureka.instance.lease-renewal-interval-in-seconds=15
eureka.instance.lease-expiration-duration-in-seconds=45

# Sharding DataSources
shard.datasource.username=${DB_USER:root}
shard.datasource.password=${DB_PASSWORD:rootpassword}
shard.datasource.shard0.url=${SHARD0_URL:jdbc:mysql://localhost:3307/incident_shard_0?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
shard.datasource.shard1.url=${SHARD1_URL:jdbc:mysql://localhost:3307/incident_shard_1?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
shard.datasource.shard2.url=${SHARD2_URL:jdbc:mysql://localhost:3307/incident_shard_2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

# JWT
app.jwt.secret=${JWT_SECRET:dev-secret-key-for-local-development-only-must-be-256-bits}

# Actuator / Management
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411}/api/v2/spans
management.metrics.tags.application=incident-service
management.metrics.tags.environment=local

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.packages-to-scan=com.emergencyconnect.incident.controller

# Logging
logging.level.root=INFO
logging.level.com.emergencyconnect=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.kafka=WARN
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

spring.main.allow-bean-definition-overriding=true