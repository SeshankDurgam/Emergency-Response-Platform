apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: emergency-connect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: emergency-connect/auth-service:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: emergency-connect-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: emergency-connect-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: emergency-connect-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: emergency-connect-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: emergency-connect-secrets
                  key: JWT_SECRET
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: emergency-connect-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: emergency-connect-secrets
                  key: MAIL_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-Djavax.net.ssl.trustStore=/etc/ssl/certs/keystore.p12 -Djavax.net.ssl.trustStorePassword=ecpassword"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
              scheme: HTTPS
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "600m"
          volumeMounts:
            - name: tls-secret-volume
              mountPath: /etc/ssl/certs/
              readOnly: true
      volumes:
        - name: tls-secret-volume
          secret:
            secretName: tls-secret
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: emergency-connect
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
---
