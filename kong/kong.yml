_format_version: "3.0"
_transform: true

# ---------------------------------------------------------------
# Consumer: Kong uses this to verify the JWT signature.
# The "key" must match the "iss" claim in every token.
# The "secret" must match app.jwt.secret in application.properties.
# ---------------------------------------------------------------
consumers:
  - username: emergency-connect-app
    jwt_secrets:
      - key: emergency-connect-uae
        algorithm: HS256
        secret: dev-secret-key-for-local-development-only-must-be-256-bits

services:
  - name: auth-service
    url: http://host.docker.internal:8081
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
          - /api/v1/users
          - /api/v1/security
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
      - name: cors
        config:
          origins:
            - "http://localhost:5173"
            - "http://localhost:3000"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
          credentials: true

  - name: incident-service
    url: http://host.docker.internal:8082
    routes:
      - name: incident-routes
        paths:
          - /api/v1/incidents
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: rate-limiting
        config:
          minute: 200
          policy: local
      - name: cors
        config:
          origins:
            - "http://localhost:5173"
            - "http://localhost:3000"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
          credentials: true

  - name: resource-service
    url: http://host.docker.internal:8083
    routes:
      - name: resource-routes
        paths:
          - /api/v1/resources
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: rate-limiting
        config:
          minute: 200
          policy: local
      - name: cors
        config:
          origins:
            - "http://localhost:5173"
            - "http://localhost:3000"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
          credentials: true

  - name: dispatch-service
    url: http://host.docker.internal:8084
    routes:
      - name: dispatch-routes
        paths:
          - /api/v1/dispatch
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
      - name: rate-limiting
        config:
          minute: 200
          policy: local
      - name: cors
        config:
          origins:
            - "http://localhost:5173"
            - "http://localhost:3000"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
          credentials: true

  - name: audit-service
    url: http://host.docker.internal:8085
    routes:
      - name: audit-routes
        paths:
          - /api/v1/audit
        strip_path: false
