# ============================================================
# EUREKA SERVER - Works locally AND in Kubernetes
# ============================================================

# Server
server.port=8761
server.shutdown=graceful
server.ssl.enabled=true
server.ssl.key-store=file:${SSL_KEYSTORE_PATH:/etc/ssl/certs/keystore.p12}
server.ssl.key-store-password=ecpassword
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=emergencyconnect
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10

# Application Name
spring.application.name=eureka-server

# Eureka Server (standalone - does not register itself)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=https://localhost:8761/eureka
eureka.server.wait-time-in-ms-when-sync-empty=0
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}

# Actuator / Management
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=eureka-server
management.metrics.tags.environment=local

# Logging
logging.level.root=INFO
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n