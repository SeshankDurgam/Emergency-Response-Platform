global:
  scrape_interval: 15s

scrape_configs:
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: incident-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["incident-service:8082"]

  - job_name: resource-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["resource-service:8083"]

  - job_name: dispatch-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["dispatch-service:8084"]

  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["audit-service:8085"]

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761"]
